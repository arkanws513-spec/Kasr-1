[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kasr-1"
version = "0.1.1"
description = "Local-first verifiable skill-learning prototype"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["kasr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
