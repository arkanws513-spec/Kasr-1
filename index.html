<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101522">
<title>كاسر-1 | Kasr-1</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2b;--line:#28334a;--text:#edf2ff;--muted:#9aa8c4;--accent:#83e1c0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172540 0%,var(--bg) 58%);color:var(--text);font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:min(900px,100%);padding:22px 16px;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#83e1c0,#7199ff);color:#09121e;display:grid;place-items:center;font-weight:900;font-size:23px}.name{font-weight:800;font-size:20px}.sub{font-size:12px;color:var(--muted)}
button,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#1b2740;color:var(--text);padding:9px 13px}button:hover{border-color:var(--accent)}.intro{text-align:center;padding:34px 8px 20px}.intro h1{margin:0;font-size:clamp(26px,5vw,38px)}.intro p{color:var(--muted);margin:8px 0}
#chat{flex:1;display:flex;flex-direction:column;gap:14px;padding:12px 0 20px}.msg{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;padding:13px 16px;border:1px solid var(--line);border-radius:17px;background:var(--panel)}.msg.user{align-self:flex-start;background:#1b2940}.msg.assistant{align-self:flex-end}.msg.error{border-color:#a44b5b;color:#ffd9df}
.composer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%);padding:18px 0 6px}.composebox{display:flex;gap:10px;align-items:flex-end;background:#11192a;border:1px solid var(--line);border-radius:18px;padding:10px}.composebox:focus-within{border-color:var(--accent)}textarea{resize:vertical;min-height:48px;max-height:180px;flex:1;background:transparent;color:var(--text);border:0;outline:0;padding:10px;line-height:1.6}#send{background:var(--accent);color:#08131a;font-weight:800;border:0;min-width:76px;height:44px}.hint{text-align:center;font-size:12px;color:var(--muted);padding-top:9px}.status{font-size:12px;color:var(--muted);min-height:20px;padding:4px}
@media(max-width:560px){main{padding:14px 11px}.msg{max-width:96%}.intro{padding-top:24px}.name{font-size:18px}}
</style>
</head>
<body><main>
<header><div class="brand"><div class="logo">ك</div><div><div class="name">كاسر-1 <span style="color:var(--muted);font-weight:500">/ KASR-1</span></div><div class="sub" id="tagline">مساعد ذكي — نسخة أولية</div></div></div><button id="lang" type="button">English</button></header>
<section class="intro" id="intro"><h1 id="welcome">أهلًا بك في كاسر-1</h1><p id="desc">اكتب رسالتك لبدء المحادثة.</p></section>
<section id="chat" aria-live="polite"></section>
<div class="status" id="status"></div>
<form class="composer" id="form"><div class="composebox"><textarea id="prompt" rows="1" placeholder="اكتب رسالتك هنا..." aria-label="رسالتك" required></textarea><button id="send" type="submit">إرسال ↑</button></div><div class="hint" id="hint">قد يخطئ النموذج؛ راجع المعلومات المهمة.</div></form>
</main>
<script>
const $=id=>document.getElementById(id);let english=false,history=[];
function setLang(){document.documentElement.lang=english?'en':'ar';document.documentElement.dir=english?'ltr':'rtl';$('lang').textContent=english?'العربية':'English';$('tagline').textContent=english?'AI assistant · early version':'مساعد ذكي — نسخة أولية';$('welcome').textContent=english?'Welcome to Kasr-1':'أهلًا بك في كاسر-1';$('desc').textContent=english?'Send a message to start chatting.':'اكتب رسالتك لبدء المحادثة.';$('prompt').placeholder=english?'Type your message…':'اكتب رسالتك هنا...';$('prompt').setAttribute('aria-label',english?'Your message':'رسالتك');$('send').textContent=english?'Send ↑':'إرسال ↑';$('hint').textContent=english?'AI can make mistakes. Check important information.':'قد يخطئ النموذج؛ راجع المعلومات المهمة.'}
$('lang').onclick=()=>{english=!english;setLang()};function add(text,who,extra=''){const d=document.createElement('div');d.className='msg '+who+(extra?' '+extra:'');d.textContent=text;$('chat').appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});return d}
$('form').addEventListener('submit',async e=>{e.preventDefault();const text=$('prompt').value.trim();if(!text)return; $('prompt').value='';add(text,'user');history.push({role:'user',content:text});$('send').disabled=true;$('status').textContent=english?'Thinking…':'جارٍ التفكير…';const wait=add(english?'Generating a reply…':'يتم إنشاء الرد…','assistant');try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,language:english?'en':'ar'})});const data=await res.json();if(!res.ok)throw new Error(data.error||('HTTP '+res.status));wait.textContent=data.reply;history.push({role:'assistant',content:data.reply});if(history.length>24)history=history.slice(-24);$('status').textContent=''}catch(err){wait.classList.add('error');wait.textContent=(english?'Connection error: ':'خطأ في الاتصال: ')+err.message;$('status').textContent=english?'Check deployment environment variables and try again.':'تحقق من متغيرات الاستضافة ثم حاول مجددًا.'}finally{$('send').disabled=false;$('prompt').focus()}});
setLang();
</script></body></html>
